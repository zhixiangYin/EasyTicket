[project]
name = "easyticket"
version = "0.1.0"
description = "A step-by-step ticket search agent built with Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.7,<3.0",
  "pytest>=8.0,<9.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
easyticket = "app.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
